name: CI - Code Verification & Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ----------------------------------------------------
  # 1. Kiểm tra Backend (NestJS & Prisma)
  # ----------------------------------------------------
  backend-check:
    name: Backend Check (NestJS & Prisma)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/math_grading?schema=public"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Validate & Generate Prisma Client
        working-directory: ./backend
        run: |
          npx --no-install prisma validate
          npx --no-install prisma generate

      - name: Compile Backend TypeScript
        working-directory: ./backend
        run: npm run build

  # ----------------------------------------------------
  # 2. Kiểm tra Frontend (React & Vite)
  # ----------------------------------------------------
  frontend-check:
    name: Frontend Check (React & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Frontend Bundle
        working-directory: ./frontend
        run: npm run build

  # ----------------------------------------------------
  # 3. Kiểm tra AI-Worker (Python)
  # ----------------------------------------------------
  ai-worker-check:
    name: AI Worker Check (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: ai-worker/requirements.txt

      - name: Install dependencies
        working-directory: ./ai-worker
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Python Syntax Verification
        working-directory: ./ai-worker
        run: python -m py_compile worker.py
