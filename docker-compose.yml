version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: math_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: math_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"

  minio:
    image: minio/minio:latest
    container_name: math_minio
    restart: always
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: minio/mc:latest
    container_name: math_minio_init
    depends_on:
      - minio
    entrypoint: >
      sh -c "
      sleep 5;
      /usr/bin/mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing local/${S3_BUCKET};
      /usr/bin/mc anonymous set download local/${S3_BUCKET};
      /usr/bin/mc anonymous set public local/${S3_BUCKET};
      exit 0;
      "

  nestjs-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: math_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      RABBITMQ_URL: "${RABBITMQ_URL}"
      S3_ENDPOINT: "${S3_ENDPOINT}"
      S3_EXTERNAL_ENDPOINT: "${S3_EXTERNAL_ENDPOINT}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      S3_BUCKET: "${S3_BUCKET}"
      AWS_REGION: "${AWS_REGION}"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      - postgres-db
      - rabbitmq
      - minio-create-bucket

  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: math_ai_worker
    restart: always
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL}"
    depends_on:
      - rabbitmq

  react-client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: math_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - nestjs-api

volumes:
  postgres_data:
  minio_data:
