services:
  postgres-db:
    image: postgres:15-alpine
    container_name: math_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - math_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: math_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - math_network

  nestjs-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: math_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      RABBITMQ_URL: "${RABBITMQ_URL}"
      S3_ENDPOINT: "${S3_ENDPOINT}"
      S3_EXTERNAL_ENDPOINT: "${S3_EXTERNAL_ENDPOINT}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      S3_BUCKET: "${S3_BUCKET}"
      AWS_REGION: "${AWS_REGION}"
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      postgres-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - math_network

  ai-worker:
    build:
      context: ./ai-worker
      dockerfile: Dockerfile
    container_name: math_ai_worker
    restart: always
    environment:
      RABBITMQ_URL: "${RABBITMQ_URL}"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - math_network

  react-client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: math_frontend
    restart: always
    ports:
      - "80:80"
      - "5173:80"
    depends_on:
      - nestjs-api
    networks:
      - math_network

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  math_network:
    driver: bridge
